# ============================================================
# KG Platform - Docker Compose 生产部署配置
# ============================================================
# 启动: docker compose up -d
# 停止: docker compose down
# 日志: docker compose logs -f backend-api
# 重建: docker compose up -d --build
#
# 端口映射:
#   - 80:   Vue 前端 (Nginx)
#   - 8000: FastAPI 后端 (Swagger UI: http://server-ip:8000/docs)
#   - 5432: PostgreSQL
#   - 7474 / 7687: Neo4j (按需启动: --profile full)
#
# 所有敏感配置通过 .env 文件注入，请勿将 .env 提交到 Git
# ============================================================

version: "3.9"

services:
  # ---- PostgreSQL 数据库 ----
  postgres-db:
    image: postgres:16-alpine
    container_name: kg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在.env中设置POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-kg_platform}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-kg_platform}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---- Neo4j 图数据库 (按需) ----
  neo4j-graph:
    image: neo4j:5-community
    container_name: kg-neo4j
    restart: unless-stopped
    profiles: ["full"]
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?请在.env中设置NEO4J_PASSWORD}
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_apoc_import_file_use__neo4j__config: "true"
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs

  # ---- FastAPI 后端 ----
  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kg-backend
    restart: unless-stopped
    depends_on:
      postgres-db:
        condition: service_healthy
    environment:
      KG_ENV: production
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres-db:5432/${POSTGRES_DB:-kg_platform}
      NEO4J_URL: bolt://neo4j-graph:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-kg_neo4j_2026}
      KG_JWT_SECRET: ${JWT_SECRET:?请在.env中设置JWT_SECRET}
      KG_ENCRYPTION_KEY: ${ENCRYPTION_KEY:?请在.env中设置ENCRYPTION_KEY}
      KG_CORS_ORIGINS: ${CORS_ORIGINS:-*}
      # 国内模型下载加速
      HF_ENDPOINT: https://hf-mirror.com
      MINERU_MODEL_SOURCE: modelscope
      UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE_MB: "50"
    ports:
      - "8000:8000"
    volumes:
      - uploads-data:/app/uploads
      - model-cache:/root/.cache        # 模型缓存（HuggingFace/ModelScope），重启不重下
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 8G

  # ---- Vue 前端 (Nginx 生产模式) ----
  frontend-app:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kg-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres-data:
  neo4j-data:
  neo4j-logs:
  uploads-data:
  model-cache:
